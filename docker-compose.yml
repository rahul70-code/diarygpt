version: '3.8'

services:
  # Database Service (PostgreSQL + Vector support)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dairygpt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dairygpt
      POSTGRES_PASSWORD: dairygpt
      POSTGRES_DB: dairygpt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dairygpt -d dairygpt"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Application Service (Unified Express Backend + Statically Exported React Frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dairygpt-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - STORAGE_MODE=${STORAGE_MODE:-local}
      - DATABASE_URL=postgresql://dairygpt:dairygpt@postgres:5432/dairygpt
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-ollama}
      
      # Sensitive secrets interpolated dynamically from your local host's .env file
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      
      # AI Provider API Keys
      - JINA_API_KEY=${JINA_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      
      # Ollama configuration to connect to local Ollama on host
      - OLLAMA_URL=http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data # Mount local database folder for SQLite persistence
    extra_hosts:
      - "host.docker.internal:host-gateway" # Resolves the host gateway so container can hit local Ollama

volumes:
  postgres_data:
